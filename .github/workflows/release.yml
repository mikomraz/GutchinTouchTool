name: Release

# Builds the app from this repository's source on tag push and attaches a
# zip to the GitHub release; mikomraz/tap's cask installs that zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          xcodebuild build \
            -scheme GutchinTouchTool \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Sign ad-hoc and package
        run: |
          APP=build/Build/Products/Release/GutchinTouchTool.app
          codesign --force --deep -s - \
            --entitlements GutchinTouchTool/GutchinTouchTool.entitlements "$APP"
          ditto -c -k --keepParent "$APP" GutchinTouchTool.zip
          shasum -a 256 GutchinTouchTool.zip | tee GutchinTouchTool.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" GutchinTouchTool.zip GutchinTouchTool.zip.sha256 \
            --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA by GitHub Actions."
